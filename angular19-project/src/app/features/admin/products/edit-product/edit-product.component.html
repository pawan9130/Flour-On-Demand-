<div class="edit-product">
  <h3>Edit Product</h3>
  <div *ngIf="product">
    <div>Name: <input [(ngModel)]="product.name" /></div>
    <div>Slug: <input [(ngModel)]="product.slug" /></div>
    <div>Category ID: <input type="number" [(ngModel)]="product.categoryId" /></div>
    <div>Price: <input type="number" [(ngModel)]="product.price" /></div>
    <div>Stock: <input type="number" [(ngModel)]="product.stock" /></div>
    <div>Description: <textarea [(ngModel)]="product.description"></textarea></div>
    <div>Images (comma separated): <input [(ngModel)]="product.imagesString" /></div>
    <div>Category: <input [(ngModel)]="product.category" /></div>
    <div>Status: <select [(ngModel)]="product.status"><option value="active">active</option><option value="inactive">inactive</option></select></div>
    <button (click)="save()">Update</button>
  </div>
</div>

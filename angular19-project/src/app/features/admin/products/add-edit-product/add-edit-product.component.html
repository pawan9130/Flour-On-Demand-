<div class="add-edit container card">
  <h3>{{id ? 'Edit' : 'Add'}} Product</h3>
  <label>Name: <input [(ngModel)]="product.name" /></label>
  <label>Price: <input type="number" [(ngModel)]="product.price" /></label>
  <label>Type: <select [(ngModel)]="product.type"><option value="regular">Regular</option><option value="bulk">Bulk</option></select></label>
  <div style="margin-top:12px"><button (click)="save()">Save</button></div>
</div>

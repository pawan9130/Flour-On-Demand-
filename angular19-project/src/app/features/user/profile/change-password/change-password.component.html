<div class="change-password container">
  <h3>Change Password</h3>
  <label>Old: <input type="password" [(ngModel)]="model.old" /></label>
  <label>New: <input type="password" [(ngModel)]="model.new" /></label>
  <label>Confirm: <input type="password" [(ngModel)]="model.confirm" /></label>
  <div><button (click)="save()">Save</button></div>
</div>

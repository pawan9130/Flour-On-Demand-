<div class="edit-profile container">
  <h3>Edit Profile</h3>
  <label>Name: <input [(ngModel)]="profile.name" /></label>
  <label>Email: <input [(ngModel)]="profile.email" /></label>
  <label>Phone: <input [(ngModel)]="profile.phone" /></label>
  <div style="margin-top:12px"><button (click)="save()">Save</button></div>
</div>

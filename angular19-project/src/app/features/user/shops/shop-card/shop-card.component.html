<div class="shop" (click)="open()">
  <div class="row">
    <div class="col-left">
      <div class="logo">🏬</div>
    </div>
    <div class="col-right">
      <h4>{{shop.name}}</h4>
      <div class="meta">⭐ {{shop.rating}} • {{shop.reviews}} reviews • {{shop.distanceKm}} km</div>
      <div class="meta">Min order ₹{{shop.minOrder}} • <span [class.open]="shop.isOpen">{{shop.isOpen ? 'Open' : 'Closed'}}</span></div>
    </div>
  </div>
</div>

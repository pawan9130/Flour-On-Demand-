<div class="audit-logs">
  <h3>Audit Logs</h3>
  <div>
    <label>From: <input type="date" [(ngModel)]="filters.from" /></label>
    <label>To: <input type="date" [(ngModel)]="filters.to" /></label>
    <label>User: <input [(ngModel)]="filters.user" /></label>
    <button (click)="load()">Filter</button>
  </div>
  <div *ngFor="let l of logs" style="border-bottom:1px solid #eee;padding:6px">
    <div><b>{{l.user}}</b> — {{l.action}} <small>{{l.timestamp | date:'short'}}</small></div>
    <div style="font-size:12px;color:#666">{{l.details | json}}</div>
  </div>
</div>
